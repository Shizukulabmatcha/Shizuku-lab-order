<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shizuku Lab · Order</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading Shizuku Lab…</div>
</div>

<script>
  function showFatalError(msg) {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<div style="padding:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;color:#7a1f1f;background:#FBEAEA;border:1px solid #B33;border-radius:12px;margin:20px;">Something went wrong loading the page:\n\n' + msg + '</div>';
    }
  }
  window.addEventListener('error', function (e) {
    showFatalError((e.message || 'Unknown error') + '\n(' + (e.filename || '') + ':' + (e.lineno || '') + ')');
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFatalError('Unhandled promise rejection: ' + ((e.reason && e.reason.message) || e.reason || 'unknown'));
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
