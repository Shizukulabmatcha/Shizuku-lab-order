<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome · Shizuku Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="welcome-page">
  <div class="welcome-announcement" id="welcome-announcement" hidden role="dialog" aria-modal="true" aria-labelledby="welcome-announcement-title">
    <section class="welcome-announcement-card">
      <button class="welcome-announcement-close" id="welcome-announcement-close" type="button" aria-label="Close">×</button>
      <div class="welcome-announcement-kicker">Shizuku Lab update</div>
      <h2 class="welcome-announcement-title" id="welcome-announcement-title"></h2>
      <p class="welcome-announcement-message" id="welcome-announcement-message"></p>
      <div class="welcome-announcement-promo" id="welcome-announcement-promo" hidden>
        <span class="welcome-announcement-code" id="welcome-announcement-code"></span>
        <button class="welcome-announcement-copy" id="welcome-announcement-copy" type="button">Copy code</button>
      </div>
      <button class="welcome-announcement-continue" id="welcome-announcement-continue" type="button">Continue</button>
    </section>
  </div>
  <main class="welcome-card" id="welcome-app">
    <div class="welcome-logo-frame"><img class="welcome-logo" src="logo.png" alt="Shizuku Lab logo"></div>
    <h1 class="welcome-title">Shizuku Lab</h1>
    <div class="welcome-sub">雫ラボ · CRAFTED DROP BY DROP</div>
    <p class="welcome-copy">Little cups, big comfort. Freshly whisked matcha, crafted one cup at a time.</p>
    <div class="welcome-actions">
      <a class="welcome-enter" href="order.html">Enter ordering →</a>
      <div class="welcome-tools">
        <a class="welcome-tool welcome-track" href="order.html?screen=track">Track order</a>
        <a class="welcome-tool welcome-loyalty" href="order.html?screen=loyalty">Check your loyalty</a>
      </div>
    </div>
    <div class="welcome-powered-by" id="welcome-powered-by"><span>Powered by Slow Studio</span></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
